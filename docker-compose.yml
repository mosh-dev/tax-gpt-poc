version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: tax-gpt-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=tax-gpt
    restart: unless-stopped
    networks:
      - tax-gpt-network
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Backend API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tax-gpt-server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # LMStudio Configuration
      - LMSTUDIO_URL=${LMSTUDIO_URL:-http://host.docker.internal:1234}
      - LMSTUDIO_MODEL=${LMSTUDIO_MODEL:-openai/gpt-oss-20b}
      # MongoDB Configuration
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/tax-gpt}
    extra_hosts:
      # Enable host.docker.internal on Linux
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - tax-gpt-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      # Centralized storage for all files (uploads, PDFs, temp, tesseract data)
      - ./server/storage:/app/server/storage

  # Frontend Client (React + Nginx)
  client:
    build:
      context: ./client-react
      dockerfile: Dockerfile
    container_name: tax-gpt-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - tax-gpt-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  tax-gpt-network:
    driver: bridge

volumes:
  mongodb-data:
    driver: local