version: '3.8'

# Combined docker-compose for running both client and server together
# For separate deployment, use individual docker-compose files in server/ and client-react/

services:
  # Backend API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tax-gpt-server
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env.dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - tax-gpt-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./server/storage:/app/storage

  # Frontend Client (React + Nginx)
  client:
    build:
      context: ./client-react
      dockerfile: Dockerfile
      args:
        - AGENT_SERVER_URL=${AGENT_SERVER_URL:-}
    container_name: tax-gpt-client
    env_file:
      - ./client-react/.env.dev
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - tax-gpt-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  tax-gpt-network:
    driver: bridge
